<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Missing Christmas Box</title>
<style>
:root{--bg:#121318;--card:#1d1f27;--ink:#f3eee4;--dim:#a39e95;--acc:#e0b85e;--line:#30323c;--bad:#e08a7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:48px 18px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--acc);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
label{display:block;color:var(--dim);font-size:15px;margin-bottom:8px}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1015;color:var(--ink);letter-spacing:.05em}
button{width:100%;margin-top:14px;font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#1a1408;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:1.6em;margin-top:12px;font-size:15px;color:var(--dim)}
.msg.bad{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.small{color:var(--dim);font-size:14px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<h1>The Missing Christmas Box</h1>
<p class="sub">A Family Mystery Adventure</p>
<div class="card">
<form id="f" autocomplete="off">
<label for="c">Enter the access code from your instructions</label>
<input id="c" inputmode="text" autocapitalize="none" spellcheck="false" placeholder="Access code">
<button id="go" type="submit">Open the game</button>
</form>
<div class="bar" id="bar"><i id="pg"></i></div>
<div class="msg" id="m"></div>
</div>
<p class="small">Tip: once it opens, this device remembers your code. Your progress saves at the end of each chapter.</p>
</div>
<script>
(function(){
var KEY='pipbox_code_v1',f=document.getElementById('f'),inp=document.getElementById('c'),
    go=document.getElementById('go'),m=document.getElementById('m'),bar=document.getElementById('bar'),pg=document.getElementById('pg');
function say(t,bad){m.textContent=t;m.className='msg'+(bad?' bad':'')}
function norm(c){return (c||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
var cache=null;
function fetchBin(){
  if(cache)return Promise.resolve(cache);
  bar.style.display='block';
  return fetch('game.bin',{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw new Error('net');
    var total=+r.headers.get('content-length')||0;
    if(!r.body||!r.body.getReader||!total)return r.arrayBuffer();
    var rd=r.body.getReader(),parts=[],got=0;
    function pump(){return rd.read().then(function(x){
      if(x.done){var out=new Uint8Array(got),o=0;parts.forEach(function(p){out.set(p,o);o+=p.length});return out.buffer}
      parts.push(x.value);got+=x.value.length;pg.style.width=Math.min(100,got/total*100)+'%';return pump()})}
    return pump();
  }).then(function(b){pg.style.width='100%';cache=b;return b});
}
function unlock(code,auto){
  var n=norm(code);
  if(!n){say('Please type the access code.',true);return}
  if(!(window.crypto&&crypto.subtle)){say('This browser is too old to open the game. Please try Safari, Chrome, or Edge.',true);return}
  go.disabled=true;say(auto?'Opening…':'Checking the code and loading the game…');
  var enc=new TextEncoder();
  fetchBin().then(function(buf){
    var u=new Uint8Array(buf),salt=u.slice(0,16),iv=u.slice(16,28),ct=u.slice(28);
    return crypto.subtle.importKey('raw',enc.encode(n),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])
    }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct)}).then(function(plain){return {plain:plain,code:n}},function(){throw new Error('code')});
  }).then(function(r){
    var p=new Uint8Array(r.plain),hl=(p[0]<<24)|(p[1]<<16)|(p[2]<<8)|p[3],dec=new TextDecoder();
    var head=JSON.parse(dec.decode(p.subarray(4,4+hl))),off=4+hl;
    var html=dec.decode(p.subarray(off,off+head.h));off+=head.h;
    var urls=head.i.map(function(it){var b=new Blob([p.subarray(off,off+it[1])],{type:'image/'+it[0]});off+=it[1];return URL.createObjectURL(b)});
    html=html.replace(/@@IMG(\d+)@@/g,function(_,i){return urls[+i]});
    store(KEY,r.code);
    document.open();document.write(html);document.close();
  }).catch(function(e){
    go.disabled=false;
    if(e&&e.message==='code'){store(KEY,null);say(auto?'Please enter your access code.':'That code didn’t work. Check the spelling and try again.',!auto)}
    else{say('The game couldn’t load. Check your internet connection and try again.',true)}
  });
}
f.addEventListener('submit',function(e){e.preventDefault();unlock(inp.value,false)});
var h=decodeURIComponent((location.hash||'').replace(/^#/,''));
if(h){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
var saved=h||read(KEY);
if(saved){inp.value=saved;unlock(saved,true)}
})();
</script>
</body>
</html>
